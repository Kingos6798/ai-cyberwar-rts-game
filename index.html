<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Cyberwar RTS</title>
    <style>
      :root { --panel: rgba(13, 17, 23, 0.86); --text: #d8e1ea; --dim: #8a94a6; --human: #4aa3ff; --ai: #ff8a3d; }
      html, body { margin: 0; height: 100%; background: #0b0e12; overflow: hidden; color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
      canvas { display: block; }
      /* Panels set their own display; make the hidden attribute always win. */
      [hidden] { display: none !important; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      .hud-panel { position: absolute; background: var(--panel); border: 1px solid #2c333d; border-radius: 6px; padding: 6px 10px; pointer-events: auto; }
      #hud-top { top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
      /* Fixed widths so changing numbers don't shift the rest of the bar (it looked like flicker). */
      #hud-top > span { display: inline-block; overflow: hidden; }
      #hud-top .t-time { width: 8ch; } #hud-top .t-state { width: 13.5ch; } #hud-top .t-data { width: 17ch; } #hud-top .t-power { width: 17ch; } #hud-top .t-compute { width: 12ch; } #hud-top .t-plug { width: 12ch; } #hud-top .t-meta { width: 20ch; }
      #hud-top b { color: #fff; } .ready, #hud-top .ready { color: #55d27a; } .warn, #hud-top .warn { color: #ff7a59; } .dim { color: var(--dim); }
      #hud-mode { top: 140px; left: 50%; transform: translateX(-50%); color: #ffd866; }
      #hud-messages { position: absolute; top: 175px; left: 50%; transform: translateX(-50%); text-align: center; color: #ff9b94; }
      #hud-selection { left: 8px; bottom: 8px; width: 300px; box-sizing: border-box; }
      #hud-selection .sel-head { margin-bottom: 4px; }
      #hud-selection .sel-row { display: flex; align-items: center; gap: 6px; width: 100%; margin: 2px 0; padding: 3px 6px; background: #1f2630;
        color: var(--text); border: 1px solid #3a4250; border-radius: 4px; font: inherit; font-size: 13px; cursor: pointer; text-align: left; }
      #hud-selection .sel-row:hover { border-color: #55ff99; }
      #hud-selection .ico { color: var(--human); width: 12px; }
      .bar { display: inline-block; width: 70px; height: 7px; background: #0b0e12; border-radius: 3px; overflow: hidden; vertical-align: middle; }
      .bar span { display: block; height: 100%; }
      #hud-help { right: 8px; bottom: 8px; max-width: 420px; }
      #hud-help summary { cursor: pointer; }
      #hud-help td { padding: 1px 6px; vertical-align: top; } kbd { font: 12px ui-monospace, monospace; color: #fff; }
      #hud-text { left: 8px; top: 8px; max-width: 46vw; max-height: 70vh; overflow: auto; margin: 0; font: 12px/1.35 ui-monospace, monospace; }
      #hud-guide { left: 8px; top: 8px; width: 300px; }
      #hud-guide .guide-title { font-weight: 600; margin-bottom: 4px; }
      #hud-guide ol { margin: 0; padding-left: 20px; }
      #hud-guide li { margin: 3px 0; } #hud-guide li.done { color: #55d27a; } #hud-guide li.todo { color: var(--dim); }
      #hud-guide li.current { color: #fff; font-weight: 600; }
      #hud-guide .how { font-weight: 400; color: var(--text); margin-top: 3px; font-size: 13px; }
      #hud-card { left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 6px; max-width: 760px; justify-content: center; }
      #hud-card button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 110px; padding: 6px 10px;
        background: #1f2630; color: var(--text); border: 1px solid #3a4250; border-radius: 6px; font: inherit; cursor: pointer; }
      #hud-card button:hover:not(:disabled) { background: #2a3442; border-color: var(--human); }
      #hud-card button:disabled { opacity: 0.45; cursor: not-allowed; }
      #hud-card .cost { font-size: 12px; color: #ffd866; } #hud-card kbd { font-size: 11px; color: var(--dim); }
      #hud-tip { position: fixed; max-width: 320px; background: #000c; color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 13px; pointer-events: none; }
      #hud-start { position: fixed; inset: 0; background: #000b; display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; pointer-events: auto; padding: 24px; }
      #hud-start p { max-width: 560px; font-size: 16px; }
      #hud-start button { font: 600 18px system-ui; padding: 10px 36px; border-radius: 6px; border: 0; background: var(--human); color: #001; cursor: pointer; }
      #hud-text { top: auto; bottom: 120px; }
      #hud-alerts { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); text-align: center; }
      #hud-alerts div { background: #3a2a00e6; color: #ffd866; border: 1px solid #ffd866; border-radius: 6px; padding: 6px 14px; margin-bottom: 6px; font-weight: 600; }
      #hud-minimap { right: 8px; bottom: 52px; padding: 0; cursor: crosshair; }
      #hud-intel { right: 8px; bottom: 240px; max-width: 320px; font-size: 13px; }
      #hud-chat { right: 8px; top: 56px; max-width: 360px; font-size: 13px; } #hud-chat b { color: var(--ai); }
      #key-prompt { position: fixed; inset: 0; background: #000c; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
      #key-prompt form { background: var(--panel); border: 1px solid #2c333d; border-radius: 8px; padding: 20px 24px; max-width: 520px; display: flex; flex-direction: column; gap: 10px; }
      #key-prompt h2 { margin: 0; } #key-prompt p { margin: 0; color: var(--dim); }
      #key-prompt label { display: flex; flex-direction: column; gap: 4px; } #key-prompt label.remember { flex-direction: row; align-items: center; gap: 6px; }
      #key-prompt input:not([type=checkbox]) { font: inherit; padding: 6px 8px; background: #0b0e12; color: var(--text); border: 1px solid #3a4250; border-radius: 4px; }
      #key-prompt .actions { display: flex; gap: 8px; flex-wrap: wrap; } #key-prompt button { font: inherit; padding: 6px 14px; border-radius: 4px; border: 1px solid #3a4250; background: #1f2630; color: var(--text); cursor: pointer; }
      #key-prompt button[type=submit] { background: var(--human); color: #001; border: 0; font-weight: 600; }
      #hud-banner { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); background: var(--panel);
        padding: 20px 32px; border-radius: 8px; font-size: 24px; text-align: center; pointer-events: auto; }
      #hud-banner.has-summary { font-size: 14px; text-align: left; top: 50%; max-height: 92vh; overflow: auto; }
      .summary .head { font-size: 22px; margin-bottom: 4px; }
      .summary .totals { border-collapse: collapse; margin: 10px 0; font-variant-numeric: tabular-nums; }
      .summary .totals td, .summary .totals th { padding: 2px 12px; text-align: right; border-bottom: 1px solid #2c333d; }
      .summary .totals td:first-child { text-align: left; color: var(--dim); }
      .summary .chart { position: relative; margin: 8px 0; }
      .summary .chart svg { display: block; max-width: 100%; height: auto; }
      .summary .grid { stroke: #2c333d; stroke-width: 1; }
      .summary .axis { fill: var(--dim); font-size: 10px; }
      .summary .end { fill: var(--text); font-size: 10px; }
      .summary .cross { stroke: var(--dim); stroke-width: 1; }
      .summary .sw { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
      .summary .legend { margin-left: 8px; color: var(--dim); }
      .summary .replay { margin: 8px 0; }
      .summary .replay button { background: #1f2630; color: var(--text); border: 1px solid #3a4250; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
      .summary .tip { position: absolute; top: 24px; background: #0b0e12; border: 1px solid #3a4250; border-radius: 4px; padding: 4px 8px; font-size: 12px; pointer-events: none; white-space: nowrap; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
